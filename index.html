<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa Alpha Competitions</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --surface: #14161c;
    --surface-raised: #1c1f27;
    --ink-primary: #f2f1ee;
    --ink-secondary: #b7b4ab;
    --ink-muted: #706d66;
    --accent: #ff8a3d;
    --accent-glow: rgba(255, 138, 61, 0.55);
    --past: #d9c9a3;
    --border: #2a2d36;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--surface);
    color: var(--ink-primary);
    overflow: hidden;
  }

  #app { display: flex; flex-direction: column; height: 100vh; }

  header {
    padding: 16px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    z-index: 20;
    background: var(--surface);
  }

  header h1 {
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 2px 0;
    letter-spacing: 0.2px;
  }

  header .meta {
    font-size: 12px;
    color: var(--ink-muted);
  }

  .stats {
    display: flex;
    gap: 20px;
    font-size: 12px;
    color: var(--ink-secondary);
  }
  .stats b { color: var(--ink-primary); font-size: 15px; display: block; font-weight: 700; }
  .stats .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; box-sizing: border-box; }
  .dot.upcoming { background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }
  .dot.past { background: transparent; border: 1.5px solid var(--past); }

  .body-row { display: flex; flex: 1; min-height: 0; }

  #sidebar {
    width: 280px;
    flex-shrink: 0;
    overflow-y: auto;
    border-right: 1px solid var(--border);
    background: var(--surface);
  }
  #sidebar::-webkit-scrollbar { width: 6px; }
  #sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .month-heading {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--ink-muted);
    padding: 14px 16px 6px 16px;
    font-weight: 700;
  }

  .event-row {
    padding: 8px 16px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  .event-row:hover, .event-row.active {
    background: var(--surface-raised);
    border-left-color: var(--accent);
  }
  .event-row .name {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-primary);
    line-height: 1.3;
  }
  .event-row.is-past .name { color: var(--ink-secondary); }
  .event-row .sub {
    font-size: 11px;
    color: var(--ink-muted);
    margin-top: 2px;
  }

  #map { flex: 1; background: var(--surface); }

  .marker-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .marker-dot {
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px rgba(255,138,61,0.18), 0 0 10px var(--accent-glow);
    border: 1.5px solid var(--surface);
    display: flex; align-items: center; justify-content: center;
    color: var(--surface);
    font-weight: 800;
    font-size: 11px;
  }
  .marker-dot.past {
    background: rgba(20,22,28,0.72);
    box-shadow: none;
    border: 2px solid var(--past);
    color: var(--ink-secondary);
  }
  .marker-dot.pulse::before {
    content: '';
    position: absolute;
    width: 100%; height: 100%;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2.2s ease-out infinite;
  }
  @keyframes pulse {
    0% { transform: scale(1); opacity: 0.55; }
    100% { transform: scale(2.4); opacity: 0; }
  }

  .leaflet-popup-content-wrapper {
    background: var(--surface-raised);
    color: var(--ink-primary);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .leaflet-popup-tip { background: var(--surface-raised); }
  .leaflet-popup-close-button { color: var(--ink-muted) !important; }

  .popup-title {
    font-weight: 700;
    font-size: 13px;
    margin: 0 0 8px 0;
    color: var(--ink-primary);
  }
  .popup-event {
    font-size: 12.5px;
    padding: 6px 0;
    border-top: 1px solid var(--border);
  }
  .popup-event:first-child { border-top: none; }
  .popup-event .name { font-weight: 600; }
  .popup-event .date { color: var(--ink-muted); font-size: 11.5px; margin-top: 1px; }
  .popup-event.is-past .name { color: var(--ink-secondary); }
  .badge {
    display: inline-block;
    font-size: 9.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    padding: 1px 6px;
    border-radius: 4px;
    margin-left: 6px;
    background: rgba(255,138,61,0.16);
    color: var(--accent);
    vertical-align: middle;
  }

  .no-loc-note {
    font-size: 11px;
    color: var(--ink-muted);
    padding: 8px 22px;
    border-top: 1px solid var(--border);
  }

  .leaflet-control-zoom a {
    background: var(--surface-raised) !important;
    color: var(--ink-primary) !important;
    border-color: var(--border) !important;
  }
  .leaflet-control-attribution {
    background: rgba(20,22,28,0.75) !important;
    color: var(--ink-muted) !important;
  }
  .leaflet-control-attribution a { color: var(--ink-secondary) !important; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>Calendário Alpha Competitions</h1>
      <div class="meta" id="subtitle"></div>
    </div>
    <div class="stats">
      <div><b id="statUpcoming">0</b><span class="dot upcoming"></span>por vir</div>
      <div><b id="statPast">0</b><span class="dot past"></span>já realizadas</div>
    </div>
    <div class="meta" id="updated"></div>
  </header>
  <div class="body-row">
    <div id="sidebar"></div>
    <div id="map"></div>
  </div>
  <div class="no-loc-note" id="noLocNote"></div>
</div>

<script>
const EVENTS = [{"summary": "Warriors Arena", "location": "GANDRA (PORTUGAL)", "start": "2026-09-04", "lat": 41.2069, "lon": -8.3306}, {"summary": "Red Bull Gym Clash – NATIONAL FINAL", "location": "NASHVILLE (USA)", "start": "2026-09-12", "lat": 36.1627, "lon": -86.7816}, {"summary": "Wodcelona", "location": "BARCELONA (SPAIN)", "start": "2026-09-11", "lat": 41.3851, "lon": 2.1734}, {"summary": "Nexo Hybrid", "location": "LEÓN (SPAIN)", "start": "2026-09-19", "lat": 42.5987, "lon": -5.5671}, {"summary": "No Limits Challenge Gondomar", "location": "GONDOMAR (PORTUGAL)", "start": "2026-09-19", "lat": 41.1425, "lon": -8.5286}, {"summary": "Battle Cancer – BERLIN", "location": "BERLIN (GERMANY)", "start": "2026-09-19", "lat": 52.52, "lon": 13.405}, {"summary": "TXAPELtxiki LAUDIO", "location": "LAUDIO (SPAIN)", "start": "2026-09-26", "lat": 43.1333, "lon": -2.9667}, {"summary": "Battle Cancer – GLASGOW", "location": "GLASGOW (SCOTLAND)", "start": "2026-10-03", "lat": 55.8642, "lon": -4.2518}, {"summary": "Swiss Throwdown", "location": "KRIENS (SWITZERLAND)", "start": "2026-10-09", "lat": 47.0333, "lon": 8.2833}, {"summary": "LX Games Lisboa", "location": "LISBOA (PORTUGAL)", "start": "2026-10-16", "lat": 38.7223, "lon": -9.1393}, {"summary": "Battle Cancer – LONDON", "location": "LONDON (UK)", "start": "2026-10-17", "lat": 51.5074, "lon": -0.1278}, {"summary": "Basque Crossfit Txapelketa", "location": "BILBAO (SPAIN)", "start": "2026-10-30", "lat": 43.263, "lon": -2.935}, {"summary": "Badajoz Elvas Throwdown", "location": "ELVAS (PORTUGAL)", "start": "2026-11-07", "lat": 38.8811, "lon": -7.1622}, {"summary": "Wod Games La Carlota", "location": "LA CARLOTA (SPAIN)", "start": "2026-11-14", "lat": 37.6833, "lon": -4.9333}, {"summary": "Pamplona Arena Games", "location": "PAMPLONA (SPAIN)", "start": "2026-11-14", "lat": 42.8125, "lon": -1.6458}, {"summary": "Olivo Arena Games", "location": "JAÉN (SPAIN)", "start": "2026-11-21", "lat": 37.7796, "lon": -3.7849}, {"summary": "Battle Cancer – BARCELONA", "location": "BARCELONA (SPAIN)", "start": "2026-12-12", "lat": 41.3851, "lon": 2.1734}];
const NO_LOCATION = [];
const LAST_UPDATED = "16/08/2026 00:28 UTC";
const TODAY = new Date("2026-08-16T00:00:00Z");

document.getElementById('subtitle').textContent = EVENTS.length + ' provas com localização';
document.getElementById('updated').textContent = 'Atualizado em ' + LAST_UPDATED;

if (NO_LOCATION.length) {
  document.getElementById('noLocNote').textContent =
    NO_LOCATION.length + ' prova(s) sem localização no calendário: ' +
    NO_LOCATION.map(e => e.summary).join(', ');
} else {
  document.getElementById('noLocNote').style.display = 'none';
}

function isPast(iso) { return new Date(iso) < TODAY; }
function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('pt-PT', { day: '2-digit', month: 'short', timeZone: 'UTC' });
}
function monthLabel(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('pt-PT', { month: 'long', year: 'numeric', timeZone: 'UTC' });
}

document.getElementById('statUpcoming').textContent = EVENTS.filter(e => !isPast(e.start)).length;
document.getElementById('statPast').textContent = EVENTS.filter(e => isPast(e.start)).length;

const map = L.map('map', { worldCopyJump: true, zoomControl: true }).setView([44, 4], 4);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

// group events by location
const groups = {};
EVENTS.forEach(e => {
  const key = e.lat.toFixed(3) + ',' + e.lon.toFixed(3);
  if (!groups[key]) groups[key] = { lat: e.lat, lon: e.lon, location: e.location, events: [] };
  groups[key].events.push(e);
});
Object.values(groups).forEach(g => g.events.sort((a, b) => a.start.localeCompare(b.start)));

const markersByKey = {};

Object.entries(groups).forEach(([key, g]) => {
  const nextEvent = g.events.find(e => !isPast(e.start));
  const allPast = !nextEvent;
  const count = g.events.length;
  const size = count > 1 ? 26 : 16;
  const cls = 'marker-dot' + (allPast ? ' past' : '') + (!allPast && count === 1 ? ' pulse' : '');

  const icon = L.divIcon({
    className: '',
    html: '<div class="marker-wrap" style="width:' + (size + 16) + 'px;height:' + (size + 16) + 'px;position:relative;">' +
          '<div class="' + cls + '" style="width:' + size + 'px;height:' + size + 'px;position:relative;">' +
          (count > 1 ? count : '') + '</div></div>',
    iconSize: [size + 16, size + 16],
    iconAnchor: [(size + 16) / 2, (size + 16) / 2]
  });

  const marker = L.marker([g.lat, g.lon], { icon }).addTo(map);
  markersByKey[key] = marker;

  const popupHtml =
    '<div class="popup-title">' + g.location.replace(/\s*\(.*\)/, '') + '</div>' +
    g.events.map(e => {
      const past = isPast(e.start);
      return '<div class="popup-event' + (past ? ' is-past' : '') + '">' +
        '<div class="name">' + e.summary + (!past && e === nextEvent ? '<span class="badge">próxima</span>' : '') + '</div>' +
        '<div class="date">' + fmtDate(e.start) + '</div></div>';
    }).join('');

  marker.bindPopup(popupHtml, { maxWidth: 280 });
  g._key = key;
});

const bounds = Object.values(groups).map(g => [g.lat, g.lon]);
if (bounds.length) map.fitBounds(bounds, { padding: [30, 30], maxZoom: 7 });

// sidebar list, grouped by month, chronological
const sidebar = document.getElementById('sidebar');
const sorted = [...EVENTS].sort((a, b) => a.start.localeCompare(b.start));
let currentMonth = null;
sorted.forEach(e => {
  const m = monthLabel(e.start);
  if (m !== currentMonth) {
    currentMonth = m;
    const h = document.createElement('div');
    h.className = 'month-heading';
    h.textContent = m;
    sidebar.appendChild(h);
  }
  const row = document.createElement('div');
  const past = isPast(e.start);
  row.className = 'event-row' + (past ? ' is-past' : '');
  row.innerHTML = '<div class="name">' + e.summary + '</div>' +
                   '<div class="sub">' + fmtDate(e.start) + ' · ' + e.location.replace(/\s*\(.*\)/, '') + '</div>';
  row.addEventListener('click', () => {
    const key = e.lat.toFixed(3) + ',' + e.lon.toFixed(3);
    const marker = markersByKey[key];
    if (marker) {
      map.flyTo([e.lat, e.lon], 8, { duration: 0.6 });
      setTimeout(() => marker.openPopup(), 650);
    }
  });
  sidebar.appendChild(row);
});
</script>
</body>
</html>
